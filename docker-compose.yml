# Docker Compose file for HomeIPTV
# Version 3.8 is a modern, stable version of the Compose file format.
version: "3.8"

services:
  # Define the main application service.
  # Tagged with the "container" profile: only starts when you run
  # `docker compose --profile container up`. Skip the profile if you're
  # running `node server.js` on the host and only want the Caddy proxy.
  homeiptv:
    profiles: ["container"]
    # Build from the Dockerfile in the current directory.
    build: .
    # image: ardovini/homeiptv:latest

    # Set a consistent name for the container for easy management.
    container_name: homeiptv

    # Map port 8998 on your host machine to port 8998 inside the container.
    ports:
      - "8998:8998"

    # Define the restart policy.
    # 'unless-stopped' ensures the container automatically restarts if it crashes,
    # but not when you manually stop it.
    restart: unless-stopped

    # Add volumes for persistent data.
    # This maps the './data' directory on your host to the '/data'
    # directory inside the container for app settings and sources.
    # A new volume for DVR recordings.
    volumes:
      - ./data:/data
      - ./dvr:/dvr # Mapped volume for DVR recordings

    # Load environment variables from a file on the host.
    # This allows you to set sensitive values like the session secret
    # without hardcoding them in the source code or this file.
    env_file:
      - ./.env
    # --- GPU HARDWARE ACCELERATION ---
    # To enable GPU transcoding, you must expose your GPU to the container.
    # This requires the NVIDIA Container Toolkit to be installed on your host.
    #
    # THIS SECTION IS NOW UNCOMMENTED TO ENABLE GPU ACCESS.
    #
    # For NVIDIA GPUs:
    # The 'deploy' block is the modern way to request GPU resources.
    # 'count: 1' requests one GPU. Use 'all' to pass all available GPUs.
    # The 'capabilities' should include 'gpu'.
    #
    # For Intel Quick Sync Video (QSV):
    # You need to map the /dev/dri device. UNCOMMENT the 'devices' section below.
    #
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [ gpu ]
    #
    # devices:
    #   - /dev/dri:/dev/dri

  # Caddy reverse proxy: terminates HTTPS (self-signed, local CA) so the
  # Google Cast Sender SDK gets a secure context when the app is opened
  # by LAN IP (Cast requires https:// or localhost, plain http:// on an
  # IP fails with "Cast functionality is not available").
  #
  # Upstream target is set via CADDY_UPSTREAM (in .env or the shell env):
  #   - unset/default -> "homeiptv:8998"        (proxies to the container above,
  #                                               run with --profile container)
  #   - host mode     -> "host.docker.internal:8998" (proxies to `node server.js`
  #                                               running directly on the host)
  caddy:
    image: caddy:2-alpine
    container_name: homeiptv-caddy
    restart: unless-stopped
    environment:
      - CADDY_UPSTREAM=${CADDY_UPSTREAM:-homeiptv:8998}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
