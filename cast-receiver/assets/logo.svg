<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <!-- Glowing gradient background circle -->
  <defs>
    <linearGradient id="vpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Play Icon Shape -->
  <g transform="translate(16, 12)">
    <rect width="56" height="56" rx="16" fill="url(#vpGrad)" filter="url(#glow)" />
    <!-- White Play Triangle -->
    <polygon points="23,19 41,28 23,37" fill="#ffffff" />
  </g>

  <!-- ViniPlay Text -->
  <text x="88" y="49" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Vini<tspan fill="#38bdf8">Play</tspan>
  </text>
  <text x="90" y="66" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="2" text-transform="uppercase">
    Smart TV Receiver
  </text>
</svg>
